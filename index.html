

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <title>نقشه لویزان</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background: radial-gradient(ellipse at top, #292116, #101010 55%, #050505);
      color: #f8f4e9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }

    .page {
      width: 100%;
      max-width: 440px;
      text-align: center;
      padding: 30px 22px;
      border: 1px solid #c6a454;
      border-radius: 24px;
      background: rgba(12, 12, 12, 0.96);
      box-shadow: 0 0 35px #000;
    }

    .ornament { color: #e5c36b; font-size: 32px; }
    h1 { color: #f0d17c; font-size: 30px; margin: 10px 0; }

    .subtitle {
      color: #d1c5a7;
      font-size: 15px;
      line-height: 2;
      margin-bottom: 25px;
    }

    .gold-line {
      height: 1px;
      background: linear-gradient(90deg, transparent, #c6a454, transparent);
      margin: 20px 0;
    }

    .map-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 62px;
      margin: 14px 0;
      padding: 14px;
      border: 1px solid #c8a75b;
      border-radius: 15px;
      background: linear-gradient(135deg, #292216, #111);
      color: #f4d77f;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
    }

    .symbol { font-size: 23px; }
    .hint { color: #aaa18d; font-size: 12px; line-height: 2; }
    footer { color: #d0b66f; font-size: 13px; margin-top: 20px; }
  </style>
</head>
<body>
  <main class="page">
    <div class="ornament">✦</div>
    <h1>نقشه لویزان</h1>
    <p class="subtitle">مکان‌نما را با نقشهٔ دلخواهت باز کن</p>

    <div class="gold-line"></div>

    <a class="map-button"
       href="https://maps.app.goo.gl/j9p2yBGmCkkNR1hY9"
       target="_blank" rel="noopener">
      <span class="symbol">🌐</span>
      <span>باز کردن در گوگل‌مپ</span>
    </a>

    <a class="map-button"
       href="https://nshn.ir/vbAwe2OC-6Jr"
       target="_blank" rel="noopener">
      <span class="symbol">📍</span>
      <span>باز کردن در نشان</span>
    </a>

    <a class="map-button"
       href="https://balad.ir/p/2gf79cj7hGUYBV"
       target="_blank" rel="noopener">
      <span class="symbol">🧭</span>
      <span>باز کردن در بلد</span>
    </a>

    <div class="gold-line"></div>
    <p class="hint">یکی از سه برنامه را انتخاب کن.</p>
    <footer>مکان‌نمای لاویزان</footer>
  </main>
</body>
</html>
