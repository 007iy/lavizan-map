
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>مسیریابی فروشگاه لاویزان</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  padding: 20px 14px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Tahoma, Arial, sans-serif;
  color: #f4d77f;
  background-color: #080808;
  background-image:
    linear-gradient(rgba(0,0,0,.12), rgba(0,0,0,.25)),
    url("./lavizan-new.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

.panel {
  width: 100%;
  max-width: 340px;
  padding: 20px 14px;
  text-align: center;
  background: rgba(8,8,8,.55);
  border: 1px solid rgba(200,167,91,.65);
  border-radius: 20px;
  box-shadow: 0 0 22px rgba(0,0,0,.45);
}

.logo {
  font-size: 27px;
  margin-bottom: 4px;
  color: #f4d77f;
  text-shadow: 0 0 12px #a8863c;
}

h1 {
  font-size: 24px;
  margin: 5px 0 8px;
  color: #f4d77f;
}

p {
  color: #e0d3b2;
  font-size: 12px;
  line-height: 1.9;
  margin: 8px 0 12px;
}

.line {
  width: 65px;
  height: 2px;
  margin: 0 auto 14px;
  background: linear-gradient(
    90deg, #8d6a27, #ffe5a0, #8d6a27
  );
}

a.map {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  width: 75%;
  min-height: 38px;
  margin: 9px auto;
  padding: 7px 8px;
  border: 1px solid #c8a75b;
  border-radius: 10px;
  background: linear-gradient(135deg, #302516, #101010);
  color: #f5d77f;
  text-decoration: none;
  font-size: 12px;
  font-weight: bold;
}

a.map:active {
  background: #59451f;
  transform: scale(.97);
}

.icon {
  font-size: 16px;
}

small {
  display: block;
  margin-top: 12px;
  padding-top: 9px;
  border-top: 1px solid #544326;
  color: #c8b98e;
  font-size: 11px;
  line-height: 1.8;
}
</style>
</head>

<body>
<main class="panel">

  <div class="logo">✦</div>

  <h1>نقشه لاویزان</h1>

  <p>
    برای مسیریابی به فروشگاه لاویزان<br>
    برنامهٔ موردنظر خود را انتخاب کنید
  </p>

  <div class="line"></div>

  <a class="map"
     href="https://maps.app.goo.gl/j9p2yBGmCkkNR1hY9"
     target="_blank" rel="noopener">
    <span class="icon">🌐</span>
    مسیریابی با گوگل‌مپ
  </a>

  <a class="map"
     href="https://nshn.ir/vbAwe2OC-6Jr"
     target="_blank" rel="noopener">
    <span class="icon">📍</span>
    مسیریابی با نشان
  </a>

  <a class="map"
     href="https://balad.ir/p/2gf79cj7hGUYBV"
     target="_blank" rel="noopener">
    <span class="icon">🧭</span>
    مسیریابی با بلد
  </a>

  <small>لاویزان | کیفیت، زیبایی و اعتماد</small>

</main>
</body>
</html>
