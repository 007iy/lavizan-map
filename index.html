
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نقشه لاویزان</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Tahoma,Arial,sans-serif;
  color:#f8e8b0;
  background:#080808;
  background-image:linear-gradient(#05050599,#050505bb),url("./lavizan%20(1).png");
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.panel{
  width:100%;
  max-width:420px;
  text-align:center;
  padding:28px 20px;
  border:1px solid #c8a75b;
  border-radius:22px;
  background:#080808d9;
  box-shadow:0 0 28px #000;
}
h1{color:#f1d27b;font-size:32px;margin:8px 0 12px}
p{color:#e1d3ad;line-height:2}
.line{
  height:1px;
  margin:22px 0;
  background:linear-gradient(90deg,transparent,#c8a75b,transparent)
}
a.map{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  width:100%;
  min-height:54px;
  margin:12px 0;
  padding:12px;
  border:1px solid #c8a75b;
  border-radius:13px;
  background:linear-gradient(135deg,#302516,#101010);
  color:#f5d77f;
  text-decoration:none;
  font-size:16px;
  font-weight:bold;
}
a.map:active{background:#59451f}
.icon{font-size:22px}
small{color:#c8b98e;line-height:2}
</style>
</head>
<body>
<main class="panel">
  <div style="font-size:30px">✦</div>
  <h1>نقشه لاویزان</h1>
  <p>مکان‌نما را با نقشهٔ دلخواهت باز کن</p>
  <div class="line"></div>

  <a class="map" href="https://maps.app.goo.gl/j9p2yBGmCkkNR1hY9" target="_blank" rel="noopener">
    <span class="icon">🌐</span> گوگل‌مپ
  </a>

  <a class="map" href="https://nshn.ir/vbAwe2OC-6Jr" target="_blank" rel="noopener">
    <span class="icon">📍</span> نشان
  </a>

  <a class="map" href="https://balad.ir/p/2gf79cj7hGUYBV" target="_blank" rel="noopener">
    <span class="icon">🧭</span> بلد
  </a>

  <div class="line"></div>
  <small>مسیریابی آسان با لاویزان</small>
</main>
</body>
</html>
