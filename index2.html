
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>مسیریابی فروشگاه لاویزان</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  padding: 24px 14px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Tahoma, Arial, sans-serif;
  color: #f5d783;
  background-color: #080808;
  background-image:
    linear-gradient(rgba(0,0,0,.20), rgba(0,0,0,.35)),
    url("./lavizan-new.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

.panel {
  width: 100%;
  max-width: 560px;
  padding: 28px 20px;
  text-align: center;
  background: rgba(0,0,0,.80);
  border: 2px solid #b88935;
  border-radius: 32px;
  box-shadow: 0 0 24px rgba(212,164,68,.22);
}

h1 {
  margin: 10px 0 16px;
  color: #e9bd59;
  font-size: 30px;
}

.intro {
  margin: 12px 0 22px;
  color: #f1dfb0;
  font-size: 17px;
  line-height: 2;
}

.divider {
  width: 100px;
  height: 3px;
  margin: 20px auto;
  background: #c69a43;
}

.map-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  min-height: 64px;
  margin: 14px 0;
  padding: 14px 10px;
  border: 1px solid #b9954d;
  border-radius: 15px;
  background: linear-gradient(135deg, #302515, #111111);
  color: #f5d783;
  font-size: 18px;
  font-weight: bold;
  text-decoration: none;
}

.map-button:active {
  background: #49371b;
}

.icon {
  font-size: 25px;
}

.footer {
  margin-top: 25px;
  padding-top: 18px;
  border-top: 1px solid #8b713e;
  color: #d8c59b;
  font-size: 15px;
  line-height: 2;
}

@media (max-width: 380px) {
  .panel {
    padding: 22px 14px;
  }

  h1 {
    font-size: 25px;
  }

  .intro {
    font-size: 15px;
  }

  .map-button {
    min-height: 58px;
    font-size: 16px;
  }
}
</style>
</head>

<body>
<main class="panel">

  <h1>نقشه لاویزان</h1>

  <p class="intro">
    برای مسیریابی به فروشگاه لاویزان،<br>
    برنامهٔ موردنظر خود را انتخاب کنید.
  </p>

  <div class="divider"></div>

  <a class="map-button"
     href="https://www.google.com/maps/search/?api=1&query=فروشگاه+لاویزان"
     target="_blank" rel="noopener noreferrer">
    <span class="icon">🌐</span>
    <span>مسیریابی با گوگل‌مپ</span>
  </a>

  <a class="map-button"
     href="https://nshn.ir/vbAwe2OC-6Jr"
     target="_blank" rel="noopener noreferrer">
    <span class="icon">📍</span>
    <span>مسیریابی با نشان</span>
  </a>

  <a class="map-button"
     href="https://balad.ir/p/2gf79cj7hGUYBV"
     target="_blank" rel="noopener noreferrer">
    <span class="icon">🧭</span>
    <span>مسیریابی با بلد</span>
  </a>

  <div class="footer">
    لاویزان | کیفیت، زیبایی و اعتماد
  </div>

</main>
</body>
</html>
