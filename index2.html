
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>نقشه لاویزان</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px 16px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Tahoma, Arial, sans-serif;
  color: #f4d77f;
  background:
    radial-gradient(ellipse at top, #39301c 0%, #15120c 38%, #050505 78%);
}

.page {
  width: 100%;
  max-width: 380px;
  padding: 25px 20px;
  text-align: center;
  background: rgba(12, 12, 12, 0.94);
  border: 1px solid #a8863c;
  border-radius: 22px;
  box-shadow: 0 0 28px #000;
}

.logo {
  font-size: 42px;
  margin-bottom: 10px;
}

h1 {
  font-size: 25px;
  margin: 8px 0 12px;
  color: #f4d77f;
}

.subtitle {
  color: #d0c5a8;
  font-size: 13px;
  line-height: 2;
  margin-bottom: 22px;
}

.gold-line {
  width: 70px;
  height: 2px;
  margin: 0 auto 22px;
  background: linear-gradient(90deg, #8d6a27, #ffe5a0, #8d6a27);
}

.map-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 88%;
  min-height: 46px;
  margin: 12px auto;
  padding: 10px 12px;
  border: 1px solid #c8a75b;
  border-radius: 12px;
  background: linear-gradient(135deg, #292318, #0c0c0c);
  color: #f4d77f;
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
  transition: 0.2s;
}

.map-button:active {
  transform: scale(0.97);
  background: #40331b;
}

.symbol {
  font-size: 19px;
}

.footer {
  margin-top: 23px;
  padding-top: 14px;
  border-top: 1px solid #544326;
  color: #b9aa85;
  font-size: 12px;
}
</style>
</head>

<body>
<main class="page">

  <div class="logo">✦</div>

  <h1>نقشه لاویزان</h1>

  <div class="subtitle">
    برای مسیریابی به فروشگاه لاویزان<br>
    برنامه موردنظر خود را انتخاب کنید
  </div>

  <div class="gold-line"></div>

  <a class="map-button"
     href="https://www.google.com/maps/search/?api=1&amp;query=فروشگاه+لاویزان"
     target="_blank" rel="noopener">
    <span class="symbol">🌐</span>
    مسیریابی با گوگل‌مپ
  </a>

  <a class="map-button"
     href="https://nshn.ir/vbAwe2OC-6Jr"
     target="_blank" rel="noopener">
    <span class="symbol">📍</span>
    مسیریابی با نشان
  </a>

  <a class="map-button"
     href="https://balad.ir/p/2gf79cj7hGUYBV"
     target="_blank" rel="noopener">
    <span class="symbol">🧭</span>
    مسیریابی با بلد
  </a>

  <div class="footer">
    لاویزان | کیفیت، زیبایی و اعتماد
  </div>

</main>
</body>
</html>
