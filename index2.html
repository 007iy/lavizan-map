
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>مسیریابی فروشگاه لاویزان</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  padding: 20px 14px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Tahoma, Arial, sans-serif;
  color: #f4d77f;
  background-color: #080808;
  background-image:
    linear-gradient(rgba(0,0,0,.48), rgba(0,0,0,.72)),
    url("./lavizan%20(1).png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

.page {
  width: 100%;
  max-width: 380px;
  padding: 24px 16px;
  text-align: center;
  background: rgba(8,8,8,.78);
  border: 1px solid #c8a75b;
  border-radius: 22px;
  box-shadow: 0 0 28px rgba(0,0,0,.8);
}

.logo {
  font-size: 34px;
  margin-bottom: 8px;
  color: #f4d77f;
  text-shadow: 0 0 12px #a8863c;
}

h1 {
  font-size: 24px;
  margin: 8px 0 12px;
  color: #f4d77f;
}

.subtitle {
  color: #e0d3b2;
  font-size: 12px;
  line-height: 2;
  margin-bottom: 18px;
}

.gold-line {
  width: 65px;
  height: 2px;
  margin: 0 auto 18px;
  background: linear-gradient(90deg, #8d6a27, #ffe5a0, #8d6a27);
}

.map-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  width: 70%;
  min-height: 38px;
  margin: 10px auto;
  padding: 7px 8px;
  border: 1px solid #c8a75b;
  border-radius: 10px;
  background: linear-gradient(135deg, #302516, #101010);
  color: #f5d77f;
  text-decoration: none;
  font-size: 12px;
  font-weight: bold;
  transition: transform .2s, background .2s;
}

.map-button:active {
  transform: scale(.97);
  background: #59451f;
}

.symbol {
  font-size: 16px;
}

.footer {
  margin-top: 20px;
  padding-top: 12px;
  border-top: 1px solid #544326;
  color: #c8b98e;
  font-size: 11px;
  line-height: 2;
}
</style>
</head>

<body>
<main class="page">

  <div class="logo">✦</div>

  <h1>نقشه لاویزان</h1>

  <div class="subtitle">
    برای مسیریابی به فروشگاه لاویزان<br>
    برنامهٔ موردنظر خود را انتخاب کنید
  </div>

  <div class="gold-line"></div>

  <a class="map-button"
     href="https://maps.app.goo.gl/j9p2yBGmCkkNR1hY9"
     target="_blank" rel="noopener">
    <span class="symbol">🌐</span>
    مسیریابی با گوگل‌مپ
  </a>

  <a class="map-button"
     href="https://nshn.ir/vbAwe2OC-6Jr"
     target="_blank" rel="noopener">
    <span class="symbol">📍</span>
    مسیریابی با نشان
  </a>

  <a class="map-button"
     href="https://balad.ir/p/2gf79cj7hGUYBV"
     target="_blank" rel="noopener">
    <span class="symbol">🧭</span>
    مسیریابی با بلد
  </a>

  <div class="footer">
    لاویزان | کیفیت، زیبایی و اعتماد
  </div>

</main>
</body>
</html>
